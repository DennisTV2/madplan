<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#2D3F1E"/>
  <!-- Subtle gradient overlay -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" opacity="0.3"/>
  <!-- Stem -->
  <path d="M256 380 Q256 260 256 180" stroke="#A8B894" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Main leaf left -->
  <path d="M256 240 Q200 190 195 130 Q240 140 256 200" fill="#6D8B54" opacity="0.9"/>
  <!-- Main leaf right -->
  <path d="M256 280 Q310 230 318 165 Q272 178 256 240" fill="#A8B894" opacity="0.9"/>
  <!-- Small top leaf -->
  <path d="M256 190 Q238 155 240 128 Q262 142 256 190" fill="#D4DBCA" opacity="0.8"/>
  <!-- Root/base decoration -->
  <path d="M220 385 Q256 375 292 385" stroke="#6D8B54" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Text -->
  <text x="256" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="400" fill="#F0EDE6" letter-spacing="-1">Mad</text>
  <text x="256" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" font-weight="400" fill="#A8B894" letter-spacing="-1" dx="60">Plan</text>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A6435;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1C2812;stop-opacity:1"/>
    </linearGradient>
  </defs>
</svg>
